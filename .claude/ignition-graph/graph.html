<html lang="es"><head><meta charset="utf-8">
<title>Mapa de dependencias Ignition</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
<style>
  :root{--bg:#0f1419;--panel:#1a222c;--view:#4aa3df;--script:#e0902f;--msg:#57c98a;--edge:#33404d;--txt:#dfe7ee;--hi:#ff5d5d;--dim:#2a333d}
  *{box-sizing:border-box} html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);font:14px/1.4 system-ui,Segoe UI,sans-serif}
  #app{display:flex;height:100vh}
  #side{width:320px;flex:none;background:var(--panel);padding:14px;overflow:auto;border-right:1px solid #000}
  #graph{flex:1;position:relative}
  h1{font-size:15px;margin:0 0 10px} h2{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:#8fa3b5;margin:16px 0 6px}
  input,select{width:100%;padding:7px;background:#0f1720;border:1px solid #2a333d;color:var(--txt);border-radius:6px;margin-bottom:8px}
  .legend span{display:inline-flex;align-items:center;gap:6px;margin-right:12px;font-size:12px}
  .dot{width:10px;height:10px;border-radius:50%}
  .info{font-size:13px} .info b{color:#fff}
  .lst{margin:4px 0 0;padding-left:16px} .lst li{cursor:pointer;color:#9cc4e4;margin:2px 0} .lst li:hover{text-decoration:underline}
  .pill{display:inline-block;background:#0f1720;border:1px solid #2a333d;border-radius:10px;padding:1px 7px;margin:2px 2px 0 0;font-size:11px}
  .muted{color:#7c8b99} circle{cursor:pointer} text{pointer-events:none;font-size:9px;fill:#9fb0bf}
  #hint{position:absolute;bottom:10px;left:10px;color:#5f6f7d;font-size:11px}
</style></head>

      <span><span class="dot" style="background:var(--script)"></span>Script</span>
      <span><span class="dot" style="background:var(--msg)"></span>Mensaje</span></div>
    <div id="info" class="info"><p class="muted">Clic en un nodo para ver quien lo usa y que usa. Doble clic = aislar su vecindad.</p></div>
  </div>
  <div id="graph"><div id="hint">rueda = zoom · arrastrar = mover · doble clic en fondo = reset</div></div>
</div>

", "target": "message::UserManagement_UpdateScheduleModifications", "type": "sends"}, {"source": "view::cla-project::Page/UserManagement/Tools/ScheduleModifications/Available Checkbox", "target": "message::UserManagement_ScheduleModificationAvailability", "type": "sends"}, {"source": "view::cla-project::Page/UserManagement/Tools/ScheduleModifications/Date Picker", "target": "message::UserManagement_ScheduleModificationChangeDate", "type": "sends"}, {"source": "view::cla-project::Page/UserManagement/UserManagement", "target": "view::cla-project::Page/UserManagement/Views/AddEditUser", "type": "embeds"}, {"source": "view::cla-project::Page/UserManagement/UserManagement", "target": "view::cla-project::Page/UserManagement/Views/AddEditRoles", "type": "embeds"}, {"source": "view::cla-project::Page/UserManagement/UserManagement", "target": "view::cla-project::Page/UserManagement/Views/Home", "type": "embeds"}, {"source": "view::cla-project::Page/UserManagement/UserManagement", "target": "message::UserManagement_ChangeView", "type": "handles"}, {"source": "view::cla-project::Page/UserManagement/UserManagement", "target": "message::UserManagement_RefreshTables", "type": "sends"}, {"source": "view::cla-project::Page/UserManagement/Views/AddEditRoles", "target": "message::UserManagement_ChangeView", "type": "sends"}, {"source": "view::cla-project::Page/UserManagement/Views/AddEditUser", "target": "view::cla-project::Page/UserManagement/Tools/Roles Checkbox", "type": "embeds"}, {"source": "view::cla-project::Page/UserManagement/Views/AddEditUser", "target": "message::UserManagement_ContactInfoRowSelected", "type": "handles"}, {"source": "view::cla-project::Page/UserManagement/Views/AddEditUser", "target": "message::UserManagement_ContactInfoTypeChange", "type": "handles"}, {"source": "view::cla-project::Page/UserManagement/Views/AddEditUser", "target": "message::UserManagement_ContactInfoValueChange", "type": "handles"}, {"source": "view::cla-project::Page/UserManagement/Views const byId = Object.fromEntries(DATA.nodes.map(n=>[n.id,n]));
const inc = {}, out = {};
DATA.nodes.forEach(n=>{inc[n.id]=[];out[n.id]=[];});
DATA.edges.forEach(e=>{ if(out[e.source])out[e.source].push(e.target); if(inc[e.target])inc[e.target].push(e.source); });

const projSel=document.getElementById('proj');
[...new Set(DATA.nodes.map(n=>n.project))].sort().forEach(p=>{const o=document.createElement('option');o.value=p;o.textContent=p;projSel.appendChild(o);});

const W=()=>document.getElementById('graph').clientWidth, H=()=>document.getElementById('graph').clientHeight;
const svg=d3.select('#graph').append('svg').attr('width','100%').attr('height','100%');
const g=svg.append('g');
svg.call(d3.zoom().scaleExtent([0.15,4]).on('zoom',ev=>g.attr('transform',ev.transform)));
svg.on('dblclick.zoom',null).on('dblclick',()=>{selected=null;update();svg.transition().call(d3.zoom().transform,d3.zoomIdentity);});

const links=DATA.edges.map(e=>({source:e.source,target:e.target,type:e.type}));
const sim=d3.forceSimulation(DATA.nodes)
  .force('link',d3.forceLink(links).id(d=>d.id).distance(60).strength(.5))
  .force('charge',d3.forceManyBody().strength(-140))
  .force('center',d3.forceCenter(W()/2,H()/2))
  .force('collide',d3.forceCollide(14));

const link=g.append('g').attr('stroke','var(--edge)').selectAll('line').data(links).join('line').attr('stroke-width',1);
const node=g.append('g').selectAll('g').data(DATA.nodes).join('g').call(drag(sim)).on('click',(e,d)=>{selected=d.id;update();showInfo(d);});
const COLOR={view:'var(--view)',script:'var(--script)',message:'var(--msg)'};
node.append('circle').attr('r',d=>d.kind==='view'?6:d.kind==='message'?7:5).attr('fill',d=>COLOR[d.kind]||'#888').attr('stroke','#0b0f14').attr('stroke-width',1.2);
node.append('text').attr('x',8).attr('y',3).text(d=>d.label.split('/').pop());
node.append('title').text(d=>d.kind+': '+d.label+'  ['+d.project+']');

let selected=null;
sim.on('tick',()=>{ link.attr('x1',d=>d.source.x).attr('y1',d=>d.source.y).attr('x2',d=>d.target.x).attr('y2',d=>d.target.y);
  node.attr('transform',d=>`translate(${d.x},${d.y})`); });

function neigh(id){const s=new Set([id]);(inc[id]||[]).forEach(x=>s.add(x));(out[id]||[]).forEach(x=>s.add(x));return s;}
function update(){
  const q=document.getElementById('q').value.toLowerCase(), pf=projSel.value;
  const active=selected?neigh(selected):null;
  node.style('opacity',d=>{
    let ok=(!pf||d.project===pf)&&(!q||d.label.toLowerCase().includes(q));
    if(active&&!active.has(d.id))ok=false; return ok?1:.08;});
  node.select('circle').attr('stroke',d=>d.id===selected?'var(--hi)':'#0b0f14').attr('stroke-width',d=>d.id===selected?2.5:1.2);
  link.style('opacity',d=>{ if(active) return (active.has(d.source.id)&&active.has(d.target.id))?.9:.03;
    return (!pf||(d.source.project===pf&&d.target.project===pf))?.5:.05;})
    .attr('stroke',d=>selected&&d.target.id===selected?'var(--script)':selected&&d.source.id===selected?'var(--view)':'var(--edge)');
}
document.getElementById('q').addEventListener('input',update);
projSel.addEventListener('change',update);

function showInfo(d){
  const usedBy=inc[d.id]||[], usesArr=out[d.id]||[];
  const li=ids=>ids.length?('<ul class="lst">'+ids.map(i=>`<li data-id="${i}">${byId[i].label} <span class="muted">(${byId[i].kind})</span></li>`).join('')+'</ul>'):'<p class="muted">—</p>';
  let extra='';
  if(d.kind==='view')extra=`<div style="margin-top:6px">
    <span class="pill">customs: ${d.customs}</span><span class="pill">params: ${d.params}</span>
    <span class="pill">transforms: ${d.transforms}</span><span class="pill">scripts: ${d.scripts}</span></div>`;
  document.getElementById('info').innerHTML=
    `<b>${d.label}</b><div class="muted">${d.kind} · ${d.project}</div>${extra}
     ${d.file?`<div style="margin-top:6px"><span class="muted">archivo:</span><br><code style="font-size:11px;word-break:break-all;color:#9cc4e4">${d.file}</code></div>`:''}
     <h2>Usado por (${usedBy.length}) — impacto si lo cambias</h2>${li(usedBy)}
     <h2>Usa (${usesArr.length})</h2>${li(usesArr)}`;
  document.querySelectorAll('.lst li').forEach(el=>el.onclick=()=>{selected=el.dataset.id;update();showInfo(byId[el.dataset.id]);});
}
function drag(sim){return d3.drag()
  .on('start',(e,d)=>{if(!e.active)sim.alphaTarget(.3).restart();d.fx=d.x;d.fy=d.y;})
  .on('drag',(e,d)=>{d.fx=e.x;d.fy=e.y;})
  .on('end',(e,d)=>{if(!e.active)sim.alphaTarget(0);d.fx=null;d.fy=null;});}
update();
</script></body></html>
